name: Build nas-relay image

on:
  push:
    tags:
      - "nas-relay-v*"
  pull_request:
    paths:
      - nas-relay/**
      - .github/workflows/nas-relay-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nas-relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/charmmmz/charm-player/nas-relay

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify relay release version
        if: startsWith(github.ref, 'refs/tags/nas-relay-v')
        run: |
          package_version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' nas-relay/package.json | head -1)
          tag_version="${GITHUB_REF_NAME#nas-relay-v}"
          if [ -z "$package_version" ] || [ "$package_version" != "$tag_version" ]; then
            echo "::error::Git tag nas-relay-v${tag_version} does not match nas-relay/package.json ${package_version:-missing}."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/nas-relay-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=match,pattern=nas-relay-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/nas-relay-v') }}
            type=sha,prefix=sha-

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ./nas-relay
          file: ./nas-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/nas-relay-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
