name: Build nas-relay image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Build target platforms
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
          - multi
  push:
    branches:
      - main
    tags:
      - "nas-relay-v*"
    paths:
      - .forgejo/workflows/nas-relay-image.yml
      - nas-relay/**

permissions:
  contents: read
  packages: write

concurrency:
  group: nas-relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}/nas-relay
  REGISTRY_OVERRIDE: ${{ vars.REGISTRY }}
  NPM_REGISTRY_OVERRIDE: ${{ vars.NPM_REGISTRY }}
  ACR_REGISTRY_OVERRIDE: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve Forgejo runner host
        env:
          FORGEJO_HOST_IP: ${{ vars.FORGEJO_HOST_IP }}
        run: |
          forgejo_url="${GITHUB_SERVER_URL:-https://forgejo.charmmmz.xyz}"
          forgejo_host="${forgejo_url#http://}"
          forgejo_host="${forgejo_host#https://}"
          forgejo_host="${forgejo_host%%/*}"
          forgejo_host="${forgejo_host%%:*}"
          if [ -z "$forgejo_host" ]; then
            echo "::error::Cannot derive Forgejo host from GITHUB_SERVER_URL=${GITHUB_SERVER_URL:-}"
            exit 1
          fi

          if getent hosts "$forgejo_host" >/dev/null 2>&1; then
            getent hosts "$forgejo_host"
            exit 0
          fi

          forgejo_ip="${FORGEJO_HOST_IP}"
          if [ -z "$forgejo_ip" ]; then
            forgejo_ip="$(ip route show default 0.0.0.0/0 2>/dev/null | awk '{print $3; exit}')"
          fi
          if [ -z "$forgejo_ip" ]; then
            echo "::error::Cannot resolve ${forgejo_host}, and no FORGEJO_HOST_IP or Docker gateway was found."
            exit 1
          fi

          hosts_line="${forgejo_ip} ${forgejo_host}"
          if [ -w /etc/hosts ]; then
            echo "$hosts_line" >> /etc/hosts
          elif command -v sudo >/dev/null 2>&1; then
            echo "$hosts_line" | sudo tee -a /etc/hosts >/dev/null
          else
            echo "::error::Cannot write /etc/hosts; set runner DNS or provide FORGEJO_HOST_IP in an environment where /etc/hosts is writable."
            exit 1
          fi
          getent hosts "$forgejo_host"

      - name: Resolve registry
        run: |
          registry="${REGISTRY_OVERRIDE}"
          if [ -z "$registry" ]; then
            registry="${GITHUB_SERVER_URL#http://}"
            registry="${registry#https://}"
          fi
          registry="${registry%%/}"
          image_name=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          npm_registry="${NPM_REGISTRY_OVERRIDE:-https://registry.npmjs.org}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"
          echo "NPM_REGISTRY=${npm_registry}" >> "$GITHUB_ENV"

      - name: Resolve image tags
        run: |
          package_version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' nas-relay/package.json | head -1)
          short_sha=$(git rev-parse --short=12 HEAD)
          case "${GITHUB_REF:-}" in
            refs/tags/nas-relay-v*)
              release_version="${GITHUB_REF#refs/tags/nas-relay-v}"
              if [ -z "$package_version" ] || [ "$package_version" != "$release_version" ]; then
                echo "::error::Git tag nas-relay-v${release_version} does not match nas-relay/package.json ${package_version:-missing}."
                exit 1
              fi
              channel_tag="latest"
              image_tag="${release_version}"
              ;;
            *)
              channel_tag="edge"
              image_tag="sha-${short_sha}"
              ;;
          esac
          echo "channel_tag=${channel_tag}" >> "$GITHUB_ENV"
          echo "image_tag=${image_tag}" >> "$GITHUB_ENV"
          echo "Image tags: ${channel_tag}, ${image_tag}"

      - name: Resolve Aliyun ACR image
        id: acr
        run: |
          acr_registry="${ACR_REGISTRY_OVERRIDE}"
          acr_registry="${acr_registry%%/}"
          acr_namespace="${ACR_NAMESPACE}"
          acr_repository="${ACR_REPOSITORY:-sonos-nas-relay}"

          if [ -z "$acr_registry" ]; then
            echo "::error::Set repository variable ACR_REGISTRY to your ACR endpoint, for example: crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com"
            exit 1
          fi
          if [ -z "$acr_namespace" ]; then
            echo "::error::Set repository variable ACR_NAMESPACE to your ACR namespace, for example: charm"
            exit 1
          fi

          acr_image="${acr_registry}/${acr_namespace}/${acr_repository}"
          acr_image=$(printf '%s' "$acr_image" | tr '[:upper:]' '[:lower:]')
          echo "ACR_REGISTRY=${acr_registry}" >> "$GITHUB_ENV"
          echo "ACR_IMAGE=${acr_image}" >> "$GITHUB_ENV"
          echo "registry=${acr_registry}" >> "$GITHUB_OUTPUT"
          echo "image=${acr_image}" >> "$GITHUB_OUTPUT"
          echo "Aliyun ACR image: ${acr_image}"

      - name: Resolve platforms
        env:
          PLATFORM_INPUT: ${{ inputs.platforms }}
        run: |
          case "${PLATFORM_INPUT:-amd64}" in
            amd64)
              platforms="linux/amd64"
              ;;
            arm64)
              platforms="linux/arm64"
              ;;
            multi)
              platforms="linux/amd64,linux/arm64"
              ;;
            *)
              echo "Unsupported platforms input: ${PLATFORM_INPUT}" >&2
              exit 1
              ;;
          esac
          echo "Resolved platforms: ${platforms}"
          echo "PLATFORMS=${platforms}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: ${{ inputs.platforms == 'arm64' || inputs.platforms == 'multi' }}
        uses: https://github.com/docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Resolve Buildx proxy
        id: buildx-proxy
        run: |
          proxy="${HTTPS_PROXY:-${https_proxy:-${HTTP_PROXY:-${http_proxy:-}}}}"
          no_proxy="${NO_PROXY:-${no_proxy:-}}"
          echo "proxy=${proxy}" >> "$GITHUB_OUTPUT"
          echo "no_proxy=${no_proxy}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: |
            image=moby/buildkit:v0.13.2
            network=host
            env.HTTP_PROXY=${{ steps.buildx-proxy.outputs.proxy }}
            env.HTTPS_PROXY=${{ steps.buildx-proxy.outputs.proxy }}
            env.http_proxy=${{ steps.buildx-proxy.outputs.proxy }}
            env.https_proxy=${{ steps.buildx-proxy.outputs.proxy }}

      - name: Login to Forgejo registry
        uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Login to Aliyun ACR
        uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build once and push to Forgejo and Aliyun
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./nas-relay
          file: ./nas-relay/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            HTTP_PROXY=${{ steps.buildx-proxy.outputs.proxy }}
            HTTPS_PROXY=${{ steps.buildx-proxy.outputs.proxy }}
            http_proxy=${{ steps.buildx-proxy.outputs.proxy }}
            https_proxy=${{ steps.buildx-proxy.outputs.proxy }}
            NO_PROXY=${{ steps.buildx-proxy.outputs.no_proxy }}
            no_proxy=${{ steps.buildx-proxy.outputs.no_proxy }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.channel_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.image_tag }}
            ${{ steps.acr.outputs.image }}:${{ env.channel_tag }}
            ${{ steps.acr.outputs.image }}:${{ env.image_tag }}
